description:
  en: 'Sidebar grouping quick-toggle for the DeepSeek Harness Web UI: switch the sidebar session browser between workspace grouping and flat session list view with the Alt+R keyboard shortcut or by clicking the sidebar section header title (Sessions / Workspaces) directly, without opening the view options menu. Pure client-side plugin with zero runtime dependencies, driving the native sidebar.workspaces slot store.'
  zh: 'DeepSeek Harness Web GUI 侧边栏分组快捷切换插件：支持按 Alt+R 键盘快捷键或直接点击侧边栏顶部分组标题文本（会话 / 工作区 / Sessions / Workspaces），在按工作区分组（workspace）与平铺会话列表（flat）视图之间一键切换，无需展开视图选项菜单。纯客户端插件，零运行时依赖，直接调用宿主 sidebar.workspaces 槽位原生状态。'
